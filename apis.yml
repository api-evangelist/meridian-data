name: Meridian Data
description: Meridian Data, Inc. was a Battery Ventures-backed maker of network-attached
  storage (NAS) appliances, best known for the Snap! Server workgroup NAS line and one
  of the industry's first storage operating systems for entry- and workgroup-level
  appliances. Quantum Corporation acquired Meridian Data in a stock swap valued at
  roughly $85M, completed June 1, 1999, folding its technology into Quantum's storage
  systems strategy. The company has not operated independently since and publishes no
  current developer or API surface; this profile is retained for API Evangelist network
  completeness as a historical, acquired entity.
